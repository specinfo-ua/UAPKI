name: "CodeQL"

#  Static analysis of the library (C/C++) and of the bindings: Go, .NET (C#), Java.
#  On pull requests to main, on pushes to main that change the code, weekly and by hand.
#  JavaScript is not analyzed (one test file); Kotlin of the Android bindings needs a Gradle build - not analyzed.
on:
  push:
    branches: [ "main" ]
    paths:
      - 'library/**'
      - 'integration/**'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'library/**'
      - 'integration/**'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '29 8 * * 0'
  workflow_dispatch:

#  A newer push makes the analysis of the older one useless
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          #  The library: built as in native-test.yml, so that every translation unit is analyzed
          - language: c-cpp
            build-mode: manual
          #  The module is in integration/Go, not at the root: built explicitly
          - language: go
            build-mode: manual
          - language: csharp
            build-mode: none
          - language: java-kotlin
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install build dependencies
        if: matrix.language == 'c-cpp'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make libcurl4-openssl-dev

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          #  The prebuilt third-party code is not ours to fix
          config: |
            paths-ignore:
              - library/common/curl

      - name: Build the library
        if: matrix.language == 'c-cpp'
        run: |
          cmake -S library -B build-codeql -DUAPKI_DISABLE_COPY=ON
          cmake --build build-codeql -j"$(nproc)"

      - name: Build the Go bindings
        if: matrix.language == 'go'
        working-directory: integration/Go
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
