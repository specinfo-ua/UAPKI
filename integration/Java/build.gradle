plugins {
    id 'java-library'
    id 'maven-publish'
}

description = 'UAPKI for Java'
group = 'com.specinfosystems'
version = '3.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'net.java.dev.jna:jna:5.17.0'
    implementation 'com.google.code.gson:gson:2.14.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all']
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.docEncoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
}

//  The tests need the native libraries (not included in the jar):
//    UAPKI_CM_PROVIDERS - directory with cm-pkcs12, UAPKI_TEST_DATA - library/test/data,
//    the uapki library is found by JNA: -Djna.library.path (gradle test -Djna.library.path=...), PATH, LD_LIBRARY_PATH.
//  Without UAPKI_CM_PROVIDERS/UAPKI_TEST_DATA the native tests are skipped.
test {
    useJUnitPlatform()
    environment System.getenv()
    def jnaLibraryPath = System.getProperty('jna.library.path')
    if (jnaLibraryPath != null)
        systemProperty 'jna.library.path', jnaLibraryPath
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
        showStandardStreams = true
    }
}

// You can publish with
// ./gradlew publish -Pmaven_repo=$MVN_URL -PrepoUsername=$MVN_USER -PrepoPassword=$MVN_PASS
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'UAPKI for Java'
                description = 'Java integration of the UAPKI crypto library (native library uapki 3.0 via JNA)'
                url = 'https://github.com/specinfo-ua/UAPKI'
                licenses {
                    license {
                        name = 'BSD 2-Clause License'
                        url = 'https://opensource.org/licenses/BSD-2-Clause'
                    }
                }
            }
        }
    }
    repositories {
        if (findProperty('maven_repo') != null) {
            maven {
                name = 'repo'
                url = findProperty('maven_repo')
                credentials(PasswordCredentials)
            }
        }
    }
}
